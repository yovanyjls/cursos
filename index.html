<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cursos y Certificaciones — Yovany Jesús López Serrano</title>
<meta name="description" content="Catálogo buscable de cursos y certificaciones profesionales." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <span class="kicker" data-i18n="kicker">Yovany Jesús López Serrano</span>
      <h1 data-i18n="titulo">Cursos y certificaciones</h1>
    </div>
    <div class="masthead-right">
      <div class="lang-toggle" role="group" aria-label="Idioma / Language">
        <button type="button" id="langEs">ES</button>
        <button type="button" id="langEn">EN</button>
      </div>
      <div class="tally" id="tally">…</div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>
    </div>
  </div>
  <p class="subhead" data-i18n="subhead">
    Busca por nombre, área o palabra clave (por ejemplo, IA, AWS, SQL) y ordena por curso o fecha haciendo clic en el encabezado.
  </p>

  <div class="controls">
    <div class="search-slot" id="searchSlot">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="buscador" autocomplete="off" />
      <button class="clear-btn" id="clearBtn" aria-label="Limpiar búsqueda">×</button>
    </div>
    <select class="area-select" id="areaSelect"></select>
    <select class="area-select sort-select" id="sortSelect"></select>
  </div>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="nombre" style="width:38%">
            <button type="button"><span data-i18n="thCurso">Curso</span> <span class="caret"></span></button>
          </th>
          <th class="col-institucion" data-i18n="thInstitucion">Institución</th>
          <th class="sortable" data-sort="fecha">
            <button type="button"><span data-i18n="thFecha">Fecha</span> <span class="caret"></span></button>
          </th>
          <th class="num" data-i18n="thHoras">Horas</th>
          <th data-i18n="thCertificado">Certificado</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="empty-state" id="emptyState" hidden>
    <span class="glyph">🗂️</span>
    <span data-i18n="emptyPrefix">Sin coincidencias para</span> <strong id="emptyQuery"></strong>.
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
